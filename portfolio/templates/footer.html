<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Footer | Mahammad Rizwana</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* FOOTER */

        .footer {
            background-color: #0f172a;

            color: white;

            text-align: center;

            padding: 40px 20px;
        }

        .footer h2 {
            font-size: 24px;

            margin-bottom: 10px;
        }

        .footer p {
            color: #94a3b8;

            font-size: 15px;

            margin-bottom: 20px;
        }

        /* SOCIAL LINKS */

        .footer-links {
            display: flex;

            justify-content: center;

            gap: 25px;

            margin-bottom: 25px;
        }

        .footer-links a {
            color: #cbd5e1;

            text-decoration: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .footer-links a:hover {
            color: #38bdf8;
        }

        /* LINE */

        .footer-line {
            width: 80%;

            max-width: 900px;

            height: 1px;

            background-color: #334155;

            margin: 0 auto 20px auto;
        }

        /* COPYRIGHT */

        .copyright {
            color: #64748b;

            font-size: 14px;
        }

        .copyright span {
            color: #38bdf8;

            font-weight: bold;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .footer {
                padding: 35px 15px;
            }

            .footer-links {
                flex-wrap: wrap;

                gap: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- FOOTER -->

    <footer class="footer">

        <h2>
            MAHAMMAD RIZWANA
        </h2>

        <p>
            Python Fullstack Developer
        </p>


        <!-- SOCIAL LINKS -->

        <div class="footer-links">

            <a href="mailto:rizwanagosarapalli@gmail.com">
                Email
            </a>

            <a href="https://www.linkedin.com/in/gosarapalli-rizwana"
               target="_blank">
                LinkedIn
            </a>

            <a href="https://github.com/Rizwana18143"
               target="_blank">
                GitHub
            </a>

        </div>


        <div class="footer-line"></div>


        <!-- COPYRIGHT -->

        <div class="copyright">

            © 2026
            <span>Mahammad Rizwana</span>.
            All Rights Reserved.

        </div>

    </footer>


</body>

</html>
