<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Navbar | Mahammad Rizwana</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            width: 100%;

            background-color: #0f172a;

            padding: 18px 8%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 1000;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

        }


        /* =========================
           LOGO / NAME
        ========================= */

        .logo {

            color: white;

            text-decoration: none;

            font-size: 24px;

            font-weight: bold;

            letter-spacing: 1px;

        }


        .logo span {

            color: #38bdf8;

        }


        /* =========================
           NAVIGATION LINKS
        ========================= */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 30px;

            list-style: none;

        }


        .nav-links a {

            color: #cbd5e1;

            text-decoration: none;

            font-size: 15px;

            font-weight: 500;

            transition: 0.3s;

            position: relative;

        }


        .nav-links a:hover {

            color: #38bdf8;

        }


        /* UNDERLINE EFFECT */

        .nav-links a::after {

            content: "";

            position: absolute;

            width: 0;

            height: 2px;

            background-color: #38bdf8;

            left: 0;

            bottom: -7px;

            transition: 0.3s;

        }


        .nav-links a:hover::after {

            width: 100%;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .navbar {

                flex-direction: column;

                gap: 20px;

                padding: 20px 5%;

            }


            .nav-links {

                flex-wrap: wrap;

                justify-content: center;

                gap: 18px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">


        <!-- LOGO -->

        <a href="{% url 'home' %}"
           class="logo">

            RIZ<span>WANA</span>

        </a>


        <!-- NAVIGATION -->

        <ul class="nav-links">

            <li>
                <a href="{% url 'home' %}">
                    Home
                </a>
            </li>


            <li>
                <a href="{% url 'skills' %}">
                    Skills
                </a>
            </li>


            <li>
                <a href="{% url 'internships' %}">
                    Internship
                </a>
            </li>


            <li>
                <a href="{% url 'project' %}">
                    Projects
                </a>
            </li>


            <li>
                <a href="{% url 'contact' %}">
                    Contact
                </a>
            </li>

        </ul>


    </nav>


</body>

</html>
